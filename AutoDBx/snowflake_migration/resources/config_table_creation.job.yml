# The main job for auto_dbx_proj.
resources:
  jobs:
    config_table_creation:
      name: "config_table_creation"

      email_notifications:
        on_start:
          - vishal.gaurav@aidetic.in
        on_success:
          - vishal.gaurav@aidetic.in
        on_failure:
          - vishal.gaurav@aidetic.in

      tasks:
        - task_key: main_task
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: "../src/snowflake/configtablecreation.ipynb"

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
            node_type_id: Standard_D4ds_v5
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0